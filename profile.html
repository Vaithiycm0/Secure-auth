<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - SecureAuth</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">

            <a class="navbar-brand fw-bold" href="profile.html">
                SecureAuth
            </a>

            <button
                type="button"
                id="logoutButton"
                class="btn btn-light btn-sm"
            >
                Logout
            </button>

        </div>
    </nav>


    <!-- Main Content -->
    <main class="container py-5">

        <!-- Loading -->
        <div id="loadingMessage" class="text-center py-5">
            <div
                class="spinner-border text-primary"
                role="status"
            >
                <span class="visually-hidden">
                    Loading...
                </span>
            </div>

            <p class="mt-3 text-muted">
                Loading your profile...
            </p>
        </div>


        <!-- Error Message -->
        <div
            id="errorMessage"
            class="alert alert-danger d-none"
            role="alert"
        >
        </div>


        <!-- Profile Content -->
        <div id="profileContent" class="d-none">

            <!-- Welcome Section -->
            <div class="text-center mb-4">

                <h1 class="fw-bold">
                    Welcome, <span id="welcomeUsername"></span>
                </h1>

                <p class="text-muted">
                    Your SecureAuth profile
                </p>

            </div>


            <div class="row g-4">

                <!-- Account Information -->
                <div class="col-12 col-lg-6">

                    <div class="card shadow-sm h-100">

                        <div class="card-body p-4">

                            <h4 class="card-title mb-4">
                                Account Information
                            </h4>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    Username
                                </label>

                                <div
                                    id="username"
                                    class="form-control bg-light"
                                ></div>
                            </div>


                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    Email
                                </label>

                                <div
                                    id="email"
                                    class="form-control bg-light"
                                ></div>
                            </div>


                            <div>
                                <label class="form-label fw-semibold">
                                    Account Created
                                </label>

                                <div
                                    id="createdAt"
                                    class="form-control bg-light"
                                ></div>
                            </div>

                        </div>

                    </div>

                </div>


                <!-- Additional Profile Information -->
                <div class="col-12 col-lg-6">

                    <div class="card shadow-sm h-100">

                        <div class="card-body p-4">

                            <h4 class="card-title mb-4">
                                Profile Information
                            </h4>


                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    Full Name
                                </label>

                                <div
                                    id="fullName"
                                    class="form-control bg-light"
                                ></div>
                            </div>


                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    Age
                                </label>

                                <div
                                    id="age"
                                    class="form-control bg-light"
                                ></div>
                            </div>


                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    Bio
                                </label>

                                <div
                                    id="bio"
                                    class="form-control bg-light"
                                ></div>
                            </div>


                            <div>
                                <label class="form-label fw-semibold">
                                    Interests
                                </label>

                                <div id="interests"></div>
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Profile JavaScript -->
    <script src="js/profile.js"></script>

</body>
</html>
